name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run production lint
        run: ./gradlew :app:lintProductionDebug --stacktrace

      - name: Run production unit tests
        run: ./gradlew :app:testProductionDebugUnitTest --stacktrace

      - name: Build production debug APK
        run: ./gradlew :app:assembleProductionDebug --stacktrace

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: imiq-production-debug
          path: app/build/outputs/apk/production/debug/*.apk
          if-no-files-found: error
